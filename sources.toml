# Optional public source catalog: rtfm init --source sources.toml.
# HEAD tracks upstream development, not your installed dependency version.
# Use a verified release ref for version-specific questions.
# Run update NAME to fetch one source; update alone fetches every enabled source.
# To start empty instead, run rtfm init without --source.
update_interval_seconds = 900

[sources."fastapi"]
kind = "git"
location = "https://github.com/fastapi/fastapi"
refs = ["HEAD"]
docs = ["docs/en/docs/**/*", "**/README*"]
code = ["**/*.py", "**/*.rs", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.go", "**/*.c", "**/*.h", "**/*.cpp"]
exclude = ["**/changelog*", "**/CHANGELOG*", "**/release-notes*", "**/announce/**", "**/proposals/**", "**/node_modules/**", "**/vendor/**", "**/tests/**", "**/test/**"]
enabled = true

